name: "Build KiABOM"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.2"
          cache: "pip"
          cache-dependency-path: |
            src/requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements.txt
          python -m pip install --group build

      - name: Check version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: python
        run: |
          import ast
          import os
          from pathlib import Path

          source = Path("src/kiabom.py")
          expected_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")

          tree = ast.parse(source.read_text(encoding="utf-8"))

          version = None

          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if (
                          isinstance(target, ast.Name)
                          and target.id == "__version__"
                          and isinstance(node.value, ast.Constant)
                          and isinstance(node.value.value, str)
                      ):
                          version = node.value.value

          if version is None:
              raise RuntimeError("Could not find __version__")

          print(f"Repository version: {version}")
          print(f"Tag version:        {expected_version}")

          if version != expected_version:
              raise RuntimeError(
                  f"Version mismatch: __version__={version}, "
                  f"tag={expected_version}"
              )

      - name: Build
        run: python buildtools/build.py

      - name: Package release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ github.ref_name }}".Substring(1)

          $windowsZip = "dist/KiABOM-$version-windows-x64.zip"
          $pythonZip = "dist/KiABOM-$version-python.zip"

          $windowsStage = "dist/package-windows"
          $pythonStage = "dist/package-python"

          # Clean staging directories if they somehow already exist
          Remove-Item $windowsStage, $pythonStage -Recurse -Force -ErrorAction SilentlyContinue

          # Create staging directories
          New-Item -ItemType Directory -Path $windowsStage, $pythonStage | Out-Null

          # Windows distribution
          Copy-Item "dist/kiabom.exe" "$windowsStage/kiabom.exe"
          Copy-Item "LICENSE" "$windowsStage/LICENSE"

          # Python distribution
          Copy-Item "src/kiabom.py" "$pythonStage/kiabom.py"
          Copy-Item "src/requirements.txt" "$pythonStage/requirements.txt"
          Copy-Item "LICENSE" "$pythonStage/LICENSE"

          # Create archives
          Compress-Archive `
            -Path "$windowsStage/*" `
            -DestinationPath $windowsZip

          Compress-Archive `
            -Path "$pythonStage/*" `
            -DestinationPath $pythonZip

          # Remove staging directories
          Remove-Item $windowsStage, $pythonStage -Recurse -Force

          Write-Host "Created:"
          Write-Host "  $windowsZip"
          Write-Host "  $pythonZip"

      - name: Verify release ZIPs
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: python
        run: |
          import os
          import zipfile
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")

          archives = {
              "windows": (
                  Path("dist") / f"KiABOM-{version}-windows-x64.zip",
                  {
                      "kiabom.exe",
                      "LICENSE",
                  },
              ),
              "python": (
                  Path("dist") / f"KiABOM-{version}-python.zip",
                  {
                      "kiabom.py",
                      "requirements.txt",
                      "LICENSE",
                  },
              ),
          }

          for platform, (zip_path, expected_contents) in archives.items():
              if not zip_path.exists():
                  raise RuntimeError(
                      f"Expected release ZIP not found: {zip_path}"
                  )

              with zipfile.ZipFile(zip_path) as archive:
                  names = [
                      name
                      for name in archive.namelist()
                      if not name.endswith("/")
                  ]

              contents = set(names)

              if contents != expected_contents:
                  raise RuntimeError(
                      f"Unexpected contents in {zip_path}:\n"
                      f"  Expected: {sorted(expected_contents)}\n"
                      f"  Found:    {sorted(contents)}"
                  )

              print(f"Verified {platform} release:")
              print(f"  {zip_path}")
              print(f"  Contents: {sorted(contents)}")

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Creating GitHub release for ${{ github.ref_name }}..."

          gh --version
          gh auth status

          gh release create "${{ github.ref_name }}" `
            --title "KiABOM ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag

          Write-Host "GitHub release created successfully."

      - name: Upload release assets
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ github.ref_name }}".Substring(1)

          $windowsZip = "dist/KiABOM-$version-windows-x64.zip"
          $pythonZip = "dist/KiABOM-$version-python.zip"

          Write-Host "Uploading release assets..."

          Write-Host "Windows ZIP: $((Get-Item $windowsZip).Length) bytes"
          Write-Host "Python ZIP:  $((Get-Item $pythonZip).Length) bytes"

          gh release upload "${{ github.ref_name }}" `
            "$windowsZip" `
            "$pythonZip"

          Write-Host "Release assets uploaded successfully."

      - name: Upload manual build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: KiABOM-manual-${{ github.run_number }}
          path: dist/kiabom.exe
          if-no-files-found: error
